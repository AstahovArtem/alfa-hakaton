apiVersion: v1
kind: ConfigMap
metadata:
  name: pdn-shield-config
  labels:
    app: pdn-shield
data:
  config.yaml: |
    server:
      addr: ":8080"
      read_timeout: 5s
      write_timeout: 15s
      max_body_bytes: 2097152
      max_inflight: 256
      default_system: checker
    store:
      kind: redis
      redis_addr: "redis.pdn.svc.cluster.local:6379"
      ttl: 1h
      encryption_key_env: PDN_ENC_KEY
    llm:
      base_url: "https://alfagen.alfabank.ru/continue-dev/"
      api_key_env: MODEL_KEY
      model: "deepseek-ai/DeepSeek-V4-Flash-0731"
      timeout: 60s
      stream_only: true
    logging:
      level: info
      format: json
    systems:
      - id: checker
        enabled: true
        api_key: ""
        categories: []
        strategy: full
        unmask: true
        combo_rules: []
      - id: demo
        enabled: true
        api_key_env: PDN_DEMO_KEY
        categories: []
        strategy: partial
        allow_strategy_override: true
        unmask: true
      - id: chatbot
        enabled: true
        api_key_env: PDN_CHATBOT_KEY
        categories: [full_name, phone, email, card_number, cvv, pin, passport]
        strategy: token
        unmask: false
        combo_rules:
          - category: pin
            requires_any: [card_number]
      - id: legacy_crm
        enabled: false
        api_key_env: PDN_LEGACY_KEY