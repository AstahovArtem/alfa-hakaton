apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pdn-shield
  labels:
    app: pdn-shield
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pdn-shield
  minReplicas: 3
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300