rules:
  - name: phone_ru
    category: phone
    pattern: '(?i)(?:\+7|8|7)[\s(-]*\d{3,4}[\s)-]*\d{2,3}[\s-]*\d{2}[\s-]*\d{2}'
    validator: phone
    confidence: 0.9
    context:
      - телефон
      - тел
    reject_context:
      - горячая линия
      - горячей линии
      - бесплатно по россии
      - служба поддержки
      - поддержки банка
    reject_context_window: 150

  - name: phone_moscow
    category: phone
    pattern: '(?i)\(\d{3}\)[\s-]*\d{3}[\s-]*\d{2}[\s-]*\d{2}'
    validator: phone10
    require_context: true
    context_window: 40
    confidence: 0.9
    deny_context:
      - +7
      - 8
    deny_context_window: 3
    context:
      - номер
      - номеру
      - номера
      - тел
      - телефон
      - телефону
      - позвон
      - позвоните
      - позвонить
    context_after:
      - номер
      - номеру
      - номера
      - тел
      - телефон
      - телефону
      - позвон
      - позвоните
      - позвонить

  - name: phone_e164
    category: phone
    pattern: '(?i)\+\d{1,3}[\s-]*\d{2,3}[\s-]*\d{3,4}[\s-]*\d{2,4}[\s-]*\d{2,4}'
    validator: phone_e164
    confidence: 0.95

  - name: email
    category: email
    pattern: '[\p{L}\p{N}._%+\-]+@[\p{L}\p{N}.\-]+\.\p{L}{2,}'
    validator: not_bank_email
    confidence: 0.95
    reject_context:
      - работает круглосуточно
      - служба поддержки
      - горячая линия
      - поддержки банка

  - name: inn
    category: inn
    pattern: '(?i)\b\d{12}\b'
    validator: inn
    validator_soft_context:
      - инн
    confidence: 0.9
    context:
      - инн

  - name: inn_legal
    category: inn
    pattern: '(?i)\b\d{10}\b'
    validator: inn
    require_context: true
    context_window: 40
    confidence: 0.9
    context:
      - инн
      - юрлицо
      - ип
    reject_context:
      - ооо
      - ао
      - пао
      - кпп
      - огрн
      - организац

  - name: inn_spaced
    category: inn
    pattern: '(?i)\b\d{4}\s\d{4}\s\d{4}\b'
    validator: inn
    require_context: true
    context_window: 40
    confidence: 0.9
    context:
      - инн

  - name: card_number
    category: card_number
    pattern: '(?i)(?:\d[ -]?){13,19}'
    validator: luhn
    validator_soft_context:
      - карта
      - карты
      - номер карты
      - card
      - pan
    confidence: 0.9
    context:
      - карта
      - card
      - номер карты

  - name: cvv
    category: cvv
    pattern: '(?i)\b\d{3,4}\b'
    require_context: true
    context_window: 60
    confidence: 0.9
    not_in_digit_sequence: true
    context:
      - cvv
      - cvc
      - cvv2
      - cvc2
      - код безопасности
      - код с обратной стороны карты
      - код с обратной стороны
      - код на обороте
      - на обороте
      - три цифры на обороте
    context_after:
      - cvv
      - cvc
      - cvv2
      - cvc2
      - код безопасности
      - код с обратной стороны карты
      - код с обратной стороны
      - код на обороте
      - на обороте
      - три цифры на обороте
    deny_context:
      - wi-fi
      - wifi
      - домофон
      - подъезд
      - сейф
      - замок
      - пароль
      - сигнализац

  - name: pin
    category: pin
    pattern: '(?i)\b\d{4}\b'
    require_context: true
    context_window: 50
    confidence: 0.9
    not_in_digit_sequence: true
    context:
      - pin
      - пин
      - пин-код
      - pin-код
      - код от карты
    context_after:
      - pin
      - пин
      - пин-код
      - pin-код
      - код от карты
    deny_context:
      - wi-fi
      - wifi
      - домофон
      - подъезд
      - сейф
      - замок
      - пароль
      - сигнализац

  - name: passport
    category: passport
    pattern: '(?:серия\s*:?\s*(\d{4})[\s,]*номер\s*:?\s*(\d{6})|паспорт\s*:?\s*(?:с\.\s*)?(\d{4})\s*(?:№|номер|н\.|ном\.)?\s*(\d{6})|\b(\d{4})\s+(\d{6})\b|\b(\d{4})\s*(?:№|номер|н\.|ном\.)\s*(\d{6})\b|\b(\d{2}\s\d{2})\s(\d{6})\b|серия\s*:?\s*(\d{2}\s\d{2})\s*,?\s*(?:№|номер\s*:?)\s*(\d{6})|\b(\d{2}\s\d{2})\s*,?\s*(?:№|номер\s*:?)\s*(\d{6})\b)'
    validator: passport
    confidence: 0.9
    match_lower: true

  - name: passport_bare
    category: passport
    pattern: '(?i)\b\d{10}\b'
    validator: passport
    validator_soft_context:
      - паспорт
      - серия
    require_context: true
    context_window: 40
    confidence: 0.9
    context:
      - паспорт
      - серия
      - серия и номер
      - паспортные данные

  - name: division_code
    category: division_code
    pattern: '(?i)\b\d{3}-\d{3}\b'
    require_context: true
    context_window: 60
    confidence: 0.9
    context:
      - код подразделения
      - к/п
      - код подр
      - код
    context_after:
      - код подразделения
      - к/п
      - код подр
      - код

  - name: division_code_bare
    category: division_code
    pattern: '(?i)\b\d{6}\b'
    require_context: true
    context_window: 20
    confidence: 0.9
    context:
      - код подразделения
      - к/п
      - код подр

  - name: driver_license
    category: driver_license
    pattern: '(?i)(?:\b\d{2}\s\d{2}\s\d{6}\b|\b\d{4}\s\d{6}\b|\b\d{2}[а-яё]{2}\s\d{6}\b|\b\d{10}\b)'
    require_context: true
    context_window: 40
    confidence: 0.9
    context:
      - водительское
      - в/у
      - ву
      - права
      - удостоверение
    context_after:
      - водительское
      - в/у
      - ву
      - права
      - удостоверение

  - name: snils
    category: snils
    pattern: '(?i)(?:\b\d{3}[\s-]\d{3}[\s-]\d{3}[\s-]\d{2}\b|\b\d{11}\b)'
    validator: snils
    validator_soft_context:
      - снилс
      - страховой номер
    require_context: true
    context_window: 40
    confidence: 0.9
    context:
      - снилс
    context_after:
      - снилс

  - name: foreign_passport
    category: foreign_passport
    pattern: '(?i)(?:\b\d{2}\s\d{7}\b|\b[A-Z]{1,2}\d{7,8}\b|\b\d{9}\b)'
    require_context: true
    context_window: 40
    confidence: 0.9
    context:
      - загранпаспорт
      - загран
      - заграничный паспорт
      - заграничный
      - загран.
      - иностранный паспорт
      - паспорт иностранного гражданина
      - паспорт кнр
    context_after:
      - загранпаспорт
      - загран
      - заграничный паспорт
      - заграничный
      - загран.
      - иностранный паспорт
      - паспорт иностранного гражданина
      - паспорт кнр

  - name: date
    category: date
    pattern: '(?:\b\d{1,2}[./-]\d{1,2}[./-]\d{4}\b|\b\d{4}[./-]\d{1,2}[./-]\d{1,2}\b|\b\d{1,2}\s+(?:января|февраля|марта|апреля|мая|июня|июля|августа|сентября|октября|ноября|декабря)\s+\d{4}\b(?:\s+(?:года|г\.|г))?|\b\d{1,2}(?:-го|-е|-ого|-его)\s+(?:января|февраля|марта|апреля|мая|июня|июля|августа|сентября|октября|ноября|декабря)\s+\d{4}\b|\b\d{1,2}\s+(?:янв|фев|мар|апр|мая|май|июн|июл|авг|сен|сент|окт|ноя|дек)\.?\s+\d{4}\b|\b\d{4}\s+г\.?\s*,?\s+\d{1,2}(?:-го|-е|-ого|-его)?\s+(?:января|февраля|марта|апреля|мая|июня|июля|августа|сентября|октября|ноября|декабря))'
    validator: date
    confidence: 0.85
    match_lower: true
    reclassify_date: true

  - name: date_short_year
    category: date
    pattern: '(?:\b\d{1,2}[./-]\d{1,2}[./-]\d{2}\b)'
    validator: date_short_year
    confidence: 0.85
    match_lower: true
    reclassify_date: true