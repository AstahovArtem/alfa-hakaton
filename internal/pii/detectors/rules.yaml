rules:
  - name: phone_ru
    category: phone
    pattern: '(?i)(?:\+7|8|7)[\s\x{00A0}\x{202F}(-]*\d{3,4}[\s\x{00A0}\x{202F})-]*\d{2,3}[\s\x{00A0}\x{202F}-]*\d{2}[\s\x{00A0}\x{202F}-]*\d{2}'
    validator: phone
    confidence: 0.9
    context:
      - телефон
      - тел
    reject_context:
      - горячая линия
      - горячей линии
      - бесплатно по россии
      - служба поддержки
      - поддержки банка
    reject_context_window: 150

  - name: phone_moscow
    category: phone
    pattern: '(?i)\(\d{3}\)[\s\x{00A0}\x{202F}-]*\d{3}[\s\x{00A0}\x{202F}-]*\d{2}[\s\x{00A0}\x{202F}-]*\d{2}'
    validator: phone10
    require_context: true
    context_window: 40
    confidence: 0.9
    deny_context:
      - +7
      - 8
    deny_context_window: 3
    context:
      - номер
      - номеру
      - номера
      - тел
      - телефон
      - телефону
      - позвон
      - позвоните
      - позвонить
    context_after:
      - номер
      - номеру
      - номера
      - тел
      - телефон
      - телефону
      - позвон
      - позвоните
      - позвонить

  - name: phone_e164
    category: phone
    pattern: '(?i)\+\d{1,3}[\s\x{00A0}\x{202F}-]*\d{2,3}[\s\x{00A0}\x{202F}-]*\d{3,4}[\s\x{00A0}\x{202F}-]*\d{2,4}[\s\x{00A0}\x{202F}-]*\d{2,4}'
    validator: phone_e164
    confidence: 0.95
    reject_context:
      - горячая линия
      - горячей линии
      - бесплатно по россии
      - служба поддержки
      - поддержки банка
    reject_context_window: 150

  - name: phone_ru_mobile
    category: phone
    # A bare 10-digit mobile number (no leading 7/8 country code), e.g.
    # "9161234567" or "916-123-45-67". Without a phone label this is
    # ambiguous with other 10-digit identifiers (account numbers, etc.), so a
    # context keyword is mandatory.
    pattern: '(?i)\b9\d{2}[\s\x{00A0}\x{202F}-]?\d{3}[\s\x{00A0}\x{202F}-]?\d{2}[\s\x{00A0}\x{202F}-]?\d{2}\b'
    validator: phone10
    require_context: true
    context_window: 30
    confidence: 0.9
    context:
      - телефон
      - тел
      - моб
      - мобильный
      - номер телефона
      - сотовый
      - whatsapp
      - telegram
    context_after:
      - телефон
      - тел
      - моб
      - мобильный
      - номер телефона
      - сотовый
      - whatsapp
      - telegram

  - name: email
    category: email
    pattern: '[\p{L}\p{N}._%+\-]+@[\p{L}\p{N}.\-]+\.\p{L}{2,}'
    validator: not_service_email
    confidence: 0.95
    reject_context:
      - работает круглосуточно
      - служба поддержки
      - горячая линия
      - поддержки банка

  - name: inn
    category: inn
    pattern: '(?i)\b\d{12}\b'
    validator: inn
    validator_soft_context:
      - инн
    confidence: 0.9
    context:
      - инн

  - name: inn_legal
    category: inn
    pattern: '(?i)\b\d{10}\b'
    validator: inn
    require_context: true
    context_window: 40
    confidence: 0.9
    context:
      - инн
      - юрлицо
      - ип
    reject_context:
      - ооо
      - ао
      - пао
      - кпп
      - огрн
      - организац

  - name: inn_spaced
    category: inn
    # Spaced or dashed INN: the 12-digit individual form in three groups of
    # four (e.g. "5001 0073 2258" or "5001-0073-2258"), and the 10-digit
    # legal-entity form in common groupings (4+3+3, 3+3+4, 2+4+4).
    pattern: '(?i)\b(?:\d{4}[\s\x{00A0}\x{202F}-]\d{4}[\s\x{00A0}\x{202F}-]\d{4}|\d{4}[\s\x{00A0}\x{202F}-]\d{3}[\s\x{00A0}\x{202F}-]\d{3}|\d{3}[\s\x{00A0}\x{202F}-]\d{3}[\s\x{00A0}\x{202F}-]\d{4}|\d{2}[\s\x{00A0}\x{202F}-]\d{4}[\s\x{00A0}\x{202F}-]\d{4})\b'
    validator: inn
    validator_soft_context:
      - инн
    require_context: true
    context_window: 40
    confidence: 0.9
    context:
      - инн
    reject_context:
      - ооо
      - ао
      - пао
      - кпп
      - огрн
      - организац
    reject_context_window: 40

  - name: card_number
    category: card_number
    pattern: '(?i)(?:\d[ \x{00A0}\x{202F}-]?){13,19}'
    validator: luhn
    validator_soft_context:
      - карта
      - карты
      - номер карты
      - card
      - pan
    confidence: 0.9
    context:
      - карта
      - card
      - номер карты

  - name: cvv
    category: cvv
    pattern: '(?i)\b\d{3,4}\b'
    require_context: true
    context_window: 60
    confidence: 0.9
    not_in_digit_sequence: true
    context:
      - cvv
      - cvc
      - cvv2
      - cvc2
      - код безопасности
      - код с обратной стороны карты
      - код с обратной стороны
      - код на обороте
      - на обороте
      - три цифры на обороте
    context_after:
      - cvv
      - cvc
      - cvv2
      - cvc2
      - код безопасности
      - код с обратной стороны карты
      - код с обратной стороны
      - код на обороте
      - на обороте
      - три цифры на обороте
    deny_context:
      - wi-fi
      - wifi
      - домофон
      - подъезд
      - сейф
      - замок
      - пароль
      - сигнализац

  - name: pin
    category: pin
    pattern: '(?i)\b\d{4}\b'
    require_context: true
    context_window: 50
    confidence: 0.9
    not_in_digit_sequence: true
    context:
      - pin
      - пин
      - пин-код
      - pin-код
      - код от карты
    context_after:
      - pin
      - пин
      - пин-код
      - pin-код
      - код от карты
    deny_context:
      - wi-fi
      - wifi
      - домофон
      - подъезд
      - сейф
      - замок
      - пароль
      - сигнализац

  - name: passport
    category: passport
    pattern: '(?:серия[\s\x{00A0}\x{202F}]*:?[\s\x{00A0}\x{202F}]*(\d{4})[\s\x{00A0}\x{202F},.]*номер[\s\x{00A0}\x{202F}]*:?[\s\x{00A0}\x{202F}]*(\d{6})|паспорт[\s\x{00A0}\x{202F}]*:?[\s\x{00A0}\x{202F}]*(?:с\.[\s\x{00A0}\x{202F}]*)?(\d{4})[\s\x{00A0}\x{202F}]*(?:№|номер|н\.|ном\.)?[\s\x{00A0}\x{202F}]*(\d{6})|\b(\d{4})[\s\x{00A0}\x{202F}]+(\d{6})\b|\b(\d{4})[\s\x{00A0}\x{202F}]*(?:№|номер|н\.|ном\.)[\s\x{00A0}\x{202F}]*(\d{6})\b|\b(\d{2}[\s\x{00A0}\x{202F}]\d{2})[\s\x{00A0}\x{202F}](\d{6})\b|серия[\s\x{00A0}\x{202F}]*:?[\s\x{00A0}\x{202F}]*(\d{2}[\s\x{00A0}\x{202F}]\d{2})[\s\x{00A0}\x{202F}]*[,.]?[\s\x{00A0}\x{202F}]*(?:№|номер[\s\x{00A0}\x{202F}]*:?)[\s\x{00A0}\x{202F}]*(\d{6})|\b(\d{2}[\s\x{00A0}\x{202F}]\d{2})[\s\x{00A0}\x{202F}]*[,.]?[\s\x{00A0}\x{202F}]*(?:№|номер[\s\x{00A0}\x{202F}]*:?)[\s\x{00A0}\x{202F}]*(\d{6})\b)'
    validator: passport
    confidence: 0.9
    match_lower: true

  - name: passport_bare
    category: passport
    pattern: '(?i)\b\d{10}\b'
    validator: passport
    validator_soft_context:
      - паспорт
      - серия
    require_context: true
    context_window: 40
    confidence: 0.9
    context:
      - паспорт
      - серия
      - серия и номер
      - паспортные данные

  - name: division_code
    category: division_code
    # "770-001" (dash), "770 - 001" (spaced dash) and "770–001" (en dash, no
    # spaces) all mean the same division code. A dash-like separator is
    # mandatory here (the bare "код" context word is common enough in banking
    # text — confirmation codes, hotline numbers — that a space-only pair
    # needs the more specific "код подразделения"/"к/п"/"код подр" context;
    # see division_code_spaced).
    pattern: '(?i)\b\d{3}[\s\x{00A0}\x{202F}]*[-\x{2010}-\x{2015}][\s\x{00A0}\x{202F}]*\d{3}\b'
    require_context: true
    context_window: 60
    confidence: 0.9
    context:
      - код подразделения
      - к/п
      - код подр
      - код
    context_after:
      - код подразделения
      - к/п
      - код подр
      - код
    # The bare "код" context is also common in unrelated technical text (e.g.
    # an HTTP-style error count); that context disqualifies the match even
    # though "код" is nearby.
    reject_context:
      - ошибок
      - ошибка
    reject_context_window: 30

  - name: division_code_spaced
    category: division_code
    # "770 001" (space, no dash). The generic "код" context word is too
    # common (confirmation codes, hotline numbers such as "8 800 200-00-00")
    # to safely trigger on a bare space-separated digit pair, so only the
    # specific division-code phrases count as context here.
    pattern: '(?i)\b\d{3}[\s\x{00A0}\x{202F}]+\d{3}\b'
    require_context: true
    context_window: 30
    confidence: 0.9
    context:
      - код подразделения
      - к/п
      - код подр
    context_after:
      - код подразделения
      - к/п
      - код подр

  - name: division_code_bare
    category: division_code
    pattern: '(?i)\b\d{6}\b'
    require_context: true
    context_window: 20
    confidence: 0.9
    context:
      - код подразделения
      - к/п
      - код подр

  - name: driver_license
    category: driver_license
    # "77 12 345678" (digits, spaced), "7712 345678" (digits, one gap), "77 АА
    # 123456" / "77АА123456" / "77АА 123456" (2-digit region + 2-letter
    # series, Cyrillic or Latin look-alikes, spaces optional on either side)
    # and the bare 10-digit form.
    pattern: '(?i)(?:\b\d{2}[\s\x{00A0}\x{202F}]\d{2}[\s\x{00A0}\x{202F}]\d{6}\b|\b\d{4}[\s\x{00A0}\x{202F}]\d{6}\b|\b\d{2}[\s\x{00A0}\x{202F}]?[a-zа-яё]{2}[\s\x{00A0}\x{202F}]?\d{6}\b|\b\d{10}\b)'
    require_context: true
    context_window: 40
    confidence: 0.9
    context:
      - водительское
      - в/у
      - ву
      - права
      - удостоверение
    context_after:
      - водительское
      - в/у
      - ву
      - права
      - удостоверение

  - name: driver_license_labeled
    category: driver_license
    # "77 12 номер 345678" / "77 12 № 345678" (series with an explicit
    # "номер"/"№" label between series and number). A higher confidence than
    # the passport rule's bare series+number form wins the overlap when a
    # driver-license context is present (e.g. "серия 50 33 номер 776655").
    pattern: '(?i)\b\d{2}[\s\x{00A0}\x{202F}]\d{2}[\s\x{00A0}\x{202F}]*(?:№|номер)[\s\x{00A0}\x{202F}]*\d{6}\b'
    require_context: true
    context_window: 40
    # The issue date normally sits between the label and the series/number
    # (e.g. "в/у выдано 15 мая 2018, серия 50 33 номер 776655").
    context_allow_date_gap: true
    confidence: 0.92
    context:
      - водительское
      - в/у
      - ву
      - права
      - удостоверение
    context_after:
      - водительское
      - в/у
      - ву
      - права
      - удостоверение

  - name: snils
    category: snils
    pattern: '(?i)(?:\b\d{3}[\s-]\d{3}[\s-]\d{3}[\s-]\d{2}\b|\b\d{11}\b)'
    validator: snils
    validator_soft_context:
      - снилс
      - страховой номер
    require_context: true
    context_window: 40
    confidence: 0.9
    context:
      - снилс
      - страховой номер
    context_after:
      - снилс
      - страховой номер

  - name: foreign_passport
    category: foreign_passport
    pattern: '(?i)(?:\b\d{2}\s\d{7}\b|\b[A-Z]{1,2}\d{7,8}\b|\b\d{9}\b)'
    require_context: true
    context_window: 40
    confidence: 0.9
    context:
      - загранпаспорт
      - загран
      - заграничный паспорт
      - заграничный
      - загран.
      - иностранный паспорт
      - паспорт иностранного гражданина
      - паспорт кнр
    context_after:
      - загранпаспорт
      - загран
      - заграничный паспорт
      - заграничный
      - загран.
      - иностранный паспорт
      - паспорт иностранного гражданина
      - паспорт кнр

  - name: military_id
    category: id_document
    pattern: '(?i)(?:^|[^А-ЯЁ])([А-ЯЁ]{2}\s?(?:№|номер)?\s?\d{7})\b'
    group: 1
    require_context: true
    context_window: 40
    confidence: 0.9
    context:
      - военный билет
      - военник
      - воен. билет
      - военного билета
      - билет офицера запаса
      - удостоверение военнослужащего
    context_after:
      - военный билет
      - военник
      - воен. билет
      - военного билета
      - билет офицера запаса
      - удостоверение военнослужащего

  - name: residence_permit
    category: id_document
    pattern: '(?i)\b\d{2}\s?№?\s?\d{7}\b'
    require_context: true
    context_window: 40
    confidence: 0.9
    context:
      - вид на жительство
      - внж
      - вида на жительство
      - разрешение на временное проживание
      - рвп
    context_after:
      - вид на жительство
      - внж
      - вида на жительство
      - разрешение на временное проживание
      - рвп

  - name: birth_certificate
    category: id_document
    pattern: '(?i)\b[IVX]{1,4}-[А-ЯЁ]{2}\s?№?\s?\d{6}\b'
    require_context: true
    context_window: 40
    confidence: 0.9
    context:
      - свидетельство о рождении
      - свид. о рождении
      - свидетельства о рождении
      - св-во о рождении
    context_after:
      - свидетельство о рождении
      - свид. о рождении
      - свидетельства о рождении
      - св-во о рождении

  - name: date
    category: date
    pattern: '(?:\b\d{1,2}[./-]\d{1,2}[./-]\d{4}\b|\b\d{4}[./-]\d{1,2}[./-]\d{1,2}\b|\b\d{1,2}\s+(?:января|февраля|марта|апреля|мая|июня|июля|августа|сентября|октября|ноября|декабря)\s+\d{4}\b(?:\s+(?:года|г\.|г))?|\b\d{1,2}(?:-го|-е|-ого|-его)\s+(?:января|февраля|марта|апреля|мая|июня|июля|августа|сентября|октября|ноября|декабря)\s+\d{4}\b|\b\d{1,2}\s+(?:янв|фев|мар|апр|мая|май|июн|июл|авг|сен|сент|окт|ноя|дек)\.?\s+\d{4}\b|\b\d{4}\s+г\.?\s*,?\s+\d{1,2}(?:-го|-е|-ого|-его)?\s+(?:января|февраля|марта|апреля|мая|июня|июля|августа|сентября|октября|ноября|декабря)|\b\d{1,2}\s+(?:january|february|march|april|may|june|july|august|september|october|november|december)\s+\d{4}\b)'
    validator: date
    confidence: 0.85
    match_lower: true
    reclassify_date: true

  - name: date_word_short_year
    category: date
    # A day with an ordinal suffix, a month in words and a two-digit year with
    # its own ordinal suffix (e.g. "25-го марта 90-го" = 25 March 1990).
    # The trailing boundary is a character class, not \b: Go's regexp package
    # treats \b as an ASCII word boundary only, so \b right after a Cyrillic
    # letter never matches (Cyrillic letters count as non-word there too).
    pattern: '(?i)\b\d{1,2}(?:-го|-е|-ого|-его)\s+(?:января|февраля|марта|апреля|мая|июня|июля|августа|сентября|октября|ноября|декабря)\s+\d{2}-го(?:[^\p{L}]|$)'
    validator: date_word_short_year
    confidence: 0.85
    match_lower: true
    reclassify_date: true

  - name: birth_year_labeled
    category: birth_date
    # A bare year with the birth-year phrase itself in the match (e.g. "1999
    # года рождения"), so the label stays inside the span the same way it does
    # for a full word-form date (see the "date" rule's "рождения" handling).
    # The trailing boundary is a character class, not \b (see the note on
    # date_word_short_year above).
    pattern: '(?i)\b(?:19|20)\d{2}\s+года\s+рождения(?:[^\p{L}]|$)'
    # Low confidence so a fuller date at the same position never loses to this
    # (e.g. a preceding day+month already matched by the "date" rule).
    confidence: 0.6

  - name: birth_year
    category: birth_date
    # A bare year labelled as a birth year (e.g. "г.р. 1985", "1999 г.р."),
    # with no day or month. Without one of these labels a bare 4-digit number
    # is too ambiguous with amounts, codes and other IDs.
    pattern: '(?i)\b(?:19|20)\d{2}\b'
    # Low confidence so a fuller numeric or word-form date at the same
    # position (e.g. the "1995" tail of "01.05.1995") always wins the overlap
    # instead of being shrunk down to the bare year.
    confidence: 0.6
    require_context: true
    context_window: 10
    context_after_window: 10
    context:
      - г.р.
      - г. р.
    context_after:
      - г.р.
      - г. р.

  - name: date_short_year
    category: date
    pattern: '(?:\b\d{1,2}[./-]\d{1,2}[./-]\d{2}\b)'
    validator: date_short_year
    confidence: 0.85
    match_lower: true
    reclassify_date: true
    reject_context:
      - верси
      - релиз
      - build
      - v
    reject_context_window: 40